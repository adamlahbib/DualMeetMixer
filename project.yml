name: DualMeetMixer
options:
  bundleIdPrefix: com.adamlahbib
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  DualMeetMixer:
    type: application
    platform: macOS
    sources:
      - path: DualMeetMixer
    info:
      path: DualMeetMixer/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleName: Dual Meet Mixer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.4"
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "DualMeetMixer routes your microphone to two virtual devices so each meeting has its own mute control."
        NSAudioCaptureUsageDescription: "DualMeetMixer captures audio from your selected browser windows so it can route each meeting to a different ear."
    entitlements:
      path: DualMeetMixer/DualMeetMixer.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamlahbib.DualMeetMixer
    dependencies: []
  DualMeetMixerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DualMeetMixerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamlahbib.DualMeetMixerTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DualMeetMixer
schemes:
  DualMeetMixer:
    build:
      targets:
        DualMeetMixer: all
        DualMeetMixerTests: [test]
    test:
      targets:
        - DualMeetMixerTests
